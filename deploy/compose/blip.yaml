version: "3.9"

services:
  blip:
    build:
      context: ../../BLIP
      dockerfile: Dockerfile
    container_name: blip
    environment:
      - PRIVATE=false
      - PORT=7777
      - API_HOST=${API_HOST:-api}
      - API_PORT=${API_PORT:-8080}
      - API_TIMEOUT=10
      - NVIDIA_VISIBLE_DEVICES=all
      - MODEL_URL=${BLIP_MODEL_URL:-}
    volumes:
      - blip_uploads:/usr/src/app/uploads
      # Optionally mount a pre-downloaded model to avoid network download
      # - /path/on/host/model_base_capfilt_large.pth:/usr/src/app/model_base_capfilt_large.pth:ro
    ports:
      - "7777:7777"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7777/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

volumes:
  blip_uploads:

