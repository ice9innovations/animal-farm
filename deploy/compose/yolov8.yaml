version: "3.9"

services:
  yolo:
    build:
      context: ../../yolov8
      dockerfile: Dockerfile
    container_name: yolo
    environment:
      - PRIVATE=false
      - PORT=7773
      - API_HOST=${API_HOST:-api}
      - API_PORT=${API_PORT:-8080}
      - API_TIMEOUT=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - yolo_uploads:/usr/src/app/uploads
    ports:
      - "7773:7773"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7773/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

volumes:
  yolo_uploads:

