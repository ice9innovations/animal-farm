version: "3.9"

services:
  ollama-api:
    build:
      context: ../../ollama-api
      dockerfile: Dockerfile
    container_name: ollama-api
    environment:
      - PRIVATE=false
      - PORT=7782
      - API_HOST=${API_HOST:-api}
      - API_PORT=${API_PORT:-8080}
      - API_TIMEOUT=10
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ollama_uploads:/usr/src/app/uploads
    ports:
      - "7782:7782"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7782/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

volumes:
  ollama_uploads:

