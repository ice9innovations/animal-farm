version: "3.9"

services:
  metadata:
    build:
      context: ../../metadata
      dockerfile: Dockerfile
    container_name: metadata
    environment:
      - PRIVATE=false
      - PORT=7781
    volumes:
      - metadata_uploads:/usr/src/app/uploads
    ports:
      - "7781:7781"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7781/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  metadata_uploads:

